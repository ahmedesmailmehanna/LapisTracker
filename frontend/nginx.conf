# nginx is the only container exposed to the internet. It serves the React
# build and forwards API and admin requests to the Django container, so the
# browser sees a single origin (no CORS needed in production).

server {
    listen 80;
    server_name _;

    # Never send the nginx version in responses.
    server_tokens off;

    # --- Django API and admin ------------------------------------------------
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;
        # Pass the original host and client details on to Django.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django static files (admin CSS/JS) ----------------------------------
    # Filled by "collectstatic" into a volume shared with the backend.
    location /static/admin/ {
        alias /django-static/admin/;
    }
    location /static/rest_framework/ {
        alias /django-static/rest_framework/;
    }

    # --- React app -----------------------------------------------------------
    root /usr/share/nginx/html;

    # Files under /static/ have a content hash in their name, so they can be
    # cached "forever"; a new build produces new names.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Anything else returns index.html so the React app can handle the URL.
    location / {
        try_files $uri /index.html;
    }
}
