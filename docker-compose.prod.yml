# Production stack: nginx (React build + reverse proxy) -> gunicorn (Django).
#
#   On AWS the database is RDS, so only "web" and "backend" run:
#     docker compose -f docker-compose.prod.yml up -d --build
#
#   To try the production stack on your own machine, also start a local
#   PostgreSQL with the "localdb" profile:
#     docker compose -f docker-compose.prod.yml --profile localdb up --build
#
# Configuration comes from .env.prod (copy .env.prod.example).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - django_static:/app/staticfiles
    # No "ports": the backend is reachable only from the web container.

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - django_static:/django-static:ro
    depends_on:
      - backend

  db:
    profiles: ["localdb"]
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

volumes:
  django_static:
  postgres_data_prod:
